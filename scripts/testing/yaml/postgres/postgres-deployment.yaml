apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
      matchLabels:
        app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.1
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 5432
              name: postgres-port
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U postgresadmin && psql -U postgresadmin -d postgresdb -c 'SELECT 1'"
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          envFrom:
            - configMapRef:
                name: postgres-config
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: postgres-config
            items:
              - key: init-readonly-user.sql
                path: init-readonly-user.sql