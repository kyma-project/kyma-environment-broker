name: All checks passed
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - edited
    - labeled
    - unlabeled
      
jobs:
  checks-passed:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check if draft
        if: ${{ github.event.pull_request.draft }}
        run: | 
          echo "Draft PRs are not checked"
          exit 1
      - name: Check if author is kyma-gopher
        if: ${{ github.event.pull_request.user.login == 'kyma-gopher[bot]' }}
        run: |
          echo "PRs from kyma-gopher are automatically green"
          exit 0
      - uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3
        if: ${{ github.event.pull_request.user.login != 'kyma-gopher[bot]' }}
        with:
          delay: '1'
          retries: '15'
          polling_interval: '1'
          checks_exclude: 'markdown-link-check,enable-auto-merge,run-govulncheck,scan,restricted-gate,kyma-environment-broker-image,environments-cleanup-image,deprovision-retrigger-image,expirator-image,runtime-reconciler-image,subaccount-cleanup-image,subaccount-sync-image,schema-migrator-image,service-binding-cleanup-image,keb-analytics-image'
          verbose: true
