name: POC - GitHub App Auth

on:
  workflow_dispatch:

jobs:
  test-name-variants:
    name: Test user.name variants
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOPHER_BOT_APP_ID }}
          private-key: ${{ secrets.GOPHER_BOT_APP_PRIVATE_KEY }}
          repositories: kyma-environment-broker

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Get bot user ID
        id: bot-id
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')
          echo "bot-user-id=${BOT_USER_ID}" >> "$GITHUB_OUTPUT"

      - name: Create commit with user.name WITHOUT [bot]
        id: pr-without-bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-id.outputs.bot-user-id }}
          BRANCH: poc-name-test-no-bot-${{ github.run_id }}
        run: |
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git config user.name "${APP_SLUG}"
          git checkout -b "${BRANCH}"
          echo "test without [bot] in name" >> poc-test.txt
          git add poc-test.txt
          git commit -m "poc: user.name WITHOUT [bot]"
          git push origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --repo kyma-project/kyma-environment-broker \
            --head "${BRANCH}" \
            --base github-apps-tests \
            --title "POC: name WITHOUT [bot] (${{ github.run_id }})" \
            --body "Testing: correct email, user.name = kyma-gopher (no [bot])" \
            --draft)
          echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL}"

      - name: Create commit with user.name WITH [bot]
        id: pr-with-bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-id.outputs.bot-user-id }}
          BRANCH: poc-name-test-with-bot-${{ github.run_id }}
        run: |
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git config user.name "${APP_SLUG}[bot]"
          git checkout -b "${BRANCH}"
          echo "test with [bot] in name" >> poc-test.txt
          git add poc-test.txt
          git commit -m "poc: user.name WITH [bot]"
          git push origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --repo kyma-project/kyma-environment-broker \
            --head "${BRANCH}" \
            --base github-apps-tests \
            --title "POC: name WITH [bot] (${{ github.run_id }})" \
            --body "Testing: correct email, user.name = kyma-gopher[bot]" \
            --draft)
          echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL}"

      - name: Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_WITHOUT: ${{ steps.pr-without-bot.outputs.pr-url }}
          PR_WITH: ${{ steps.pr-with-bot.outputs.pr-url }}
        run: |
          [ -n "${PR_WITHOUT}" ] && gh pr close "${PR_WITHOUT}" --delete-branch || true
          [ -n "${PR_WITH}" ] && gh pr close "${PR_WITH}" --delete-branch || true
