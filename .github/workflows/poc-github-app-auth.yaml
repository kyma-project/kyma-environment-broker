name: POC - GitHub App Auth

on:
  workflow_dispatch:

jobs:
  test-static-email:
    name: Test static email attribution
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOPHER_BOT_APP_ID }}
          private-key: ${{ secrets.GOPHER_BOT_APP_PRIVATE_KEY }}
          repositories: kyma-environment-broker

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Create commit with static email (repo var style)
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: poc-static-email-${{ github.run_id }}
        run: |
          git config user.email "307071130+kyma-gopher[bot]@users.noreply.github.com"
          git config user.name "kyma-gopher"
          git checkout -b "${BRANCH}"
          echo "poc static email test ${{ github.run_id }}" >> poc-test.txt
          git add poc-test.txt
          git commit -m "poc: test static email attribution"
          git push origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --repo kyma-project/kyma-environment-broker \
            --head "${BRANCH}" \
            --base github-apps-tests \
            --title "POC: static email test (${{ github.run_id }})" \
            --body "Testing: hardcoded 307071130+kyma-gopher[bot]@users.noreply.github.com" \
            --draft)
          echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL}"

      - name: Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pr-url }}
        run: |
          [ -n "${PR_URL}" ] && gh pr close "${PR_URL}" --delete-branch || true

  test-static-email-ghe:
    name: Test static email attribution on GHE
    runs-on: ubuntu-latest
    steps:
      - name: Generate enterprise token
        id: enterprise-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GOPHER_TOOLS_BOT_APP_ID }}
          private-key: ${{ secrets.GOPHER_TOOLS_BOT_APP_PRIVATE_KEY }}
          github-api-url: https://${{ vars.GH_TOOLS_HOST }}/api/v3
          owner: kyma
          repositories: management-plane-charts

      - name: Clone management-plane-charts
        env:
          REPO_URL: https://x-access-token:${{ steps.enterprise-token.outputs.token }}@${{ vars.GH_TOOLS_HOST }}/kyma/management-plane-charts.git
        run: git clone --branch chart/keb-sap "${REPO_URL}" management-plane-charts

      - name: Create commit with static email
        id: create-pr
        env:
          GH_ENTERPRISE_TOKEN: ${{ steps.enterprise-token.outputs.token }}
          GH_HOST: ${{ vars.GH_TOOLS_HOST }}
          BRANCH: poc-static-email-ghe-${{ github.run_id }}
          REPO_URL: https://x-access-token:${{ steps.enterprise-token.outputs.token }}@${{ vars.GH_TOOLS_HOST }}/kyma/management-plane-charts.git
        run: |
          cd management-plane-charts
          git config user.email "200427+kyma-gopher[bot]@users.noreply.${{ vars.GH_TOOLS_HOST }}"
          git config user.name "kyma-gopher"
          git checkout -b "${BRANCH}"
          echo "poc static email ghe test ${{ github.run_id }}" >> poc-test.txt
          git add poc-test.txt
          git commit -m "poc: test static email attribution on GHE"
          git remote set-url origin "${REPO_URL}"
          git push origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --repo kyma/management-plane-charts \
            --head "${BRANCH}" \
            --base chart/keb-sap \
            --title "POC: static email GHE test (${{ github.run_id }})" \
            --body "Testing: hardcoded 200427+kyma-gopher[bot]@users.noreply.github.tools.sap" \
            --draft)
          echo "pr-url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL}"

      - name: Cleanup
        if: always()
        env:
          GH_ENTERPRISE_TOKEN: ${{ steps.enterprise-token.outputs.token }}
          GH_HOST: ${{ vars.GH_TOOLS_HOST }}
          BRANCH: poc-static-email-ghe-${{ github.run_id }}
          PR_URL: ${{ steps.create-pr.outputs.pr-url }}
        run: |
          [ -n "${PR_URL}" ] && gh pr close "${PR_URL}" || true
          gh api --hostname "${GH_HOST}" \
            --method DELETE \
            "/repos/kyma/management-plane-charts/git/refs/heads/${BRANCH}" || true
