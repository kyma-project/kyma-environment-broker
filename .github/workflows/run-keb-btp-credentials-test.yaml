name: KEB BTP credentials k3d test

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - "**.md"
      - "component-config.yaml"

permissions:
  contents: read

jobs:
  run-btp-credentials-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get latest K3s version
        id: k3s-version
        run: |
          VERSION=$(./scripts/testing/get-latest-k3s-releases.sh 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare K3s cluster and docker registry
        run: "./scripts/testing/k3s-setup.sh ${{ steps.k3s-version.outputs.version }} --wait"

      - name: Build and push Docker images to k3s registry
        run: ./scripts/testing/build-and-push-images.sh PR-${{ github.event.pull_request.number }}

      - name: Set global account ID
        run: |
          echo "GLOBAL_ACCOUNT_ID=2f5011af-2fd3-44ba-ac60-eeb1148c2995" >> $GITHUB_ENV

      - name: Install KEB chart
        run: scripts/testing/install_keb.sh "false" ${{ github.event.pull_request.number }}

      - name: Provision an instance
        run: |
          kubectl port-forward -n kcp-system deployment/kcp-kyma-environment-broker 8080:8080 5432:5432 &
          sleep 5
          scripts/testing/provision_instances.sh 1 aws-cluster 361c511f-f939-4621-b228-d0fb79a1fe15 aws-cluster us-east-1 http://localhost:8080

      - name: Get RuntimeID
        run: |
          while [ -z "$RUNTIME_ID" ]; do
            RUNTIME_ID=$(curl --request GET \
              --url http://localhost:8080/runtimes \
              --header 'Content-Type: application/json' \
              --header 'X-Broker-API-Version: 2.16' | jq -r '.data[] | select(.instanceID=="aws-cluster") | .runtimeID')
            if [ -z "$RUNTIME_ID" ]; then
              echo "RuntimeID is empty. Retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "RuntimeID: ${RUNTIME_ID}"
          echo "RUNTIME_ID=$RUNTIME_ID" >> $GITHUB_ENV

      - name: Create kubeconfig secret for runtime
        run: make create-kubeconfig-secret RUNTIME_ID=$RUNTIME_ID

      - name: Create GardenerCluster CR
        run: ./scripts/create_gardener_cluster_cr.sh $GLOBAL_ACCOUNT_ID $RUNTIME_ID

      - name: Set RuntimeCR State to Ready
        run: make set-runtime-state RUNTIME_ID=$RUNTIME_ID STATE=Ready

      - name: Create Shoot for instance
        run: make create-shoot RUNTIME_ID=$RUNTIME_ID

      - name: Wait for provisioning to finish
        run: ./scripts/testing/wait_for_instance_state.sh aws-cluster

      - name: Set Kyma state to Ready
        run: make set-kyma-state KYMA_ID=$RUNTIME_ID STATE=Ready

      - name: Create kyma-system namespace for BTP credentials test
        run: kubectl create namespace kyma-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Update instance with SM operator credentials
        run: |
          curl --request PATCH \
            --url "http://localhost:8080/oauth/v2/service_instances/aws-cluster?accepts_incomplete=true" \
            --header "Content-Type: application/json" \
            --header "X-Broker-API-Version: 2.16" \
            --data '{
              "service_id": "47c9dcbf-ff30-448e-ab36-d3bad66ba281",
              "plan_id": "361c511f-f939-4621-b228-d0fb79a1fe15",
              "context": {
                "globalaccount_id": "'"$GLOBAL_ACCOUNT_ID"'",
                "subaccount_id": "8b9a0db4-9aef-4da2-a856-61a4420b66fd",
                "user_id": "user@email.com",
                "sm_operator_credentials": {
                  "clientid": "test-client-id",
                  "clientsecret": "initial-secret",
                  "url": "https://token.example.com",
                  "sm_url": "https://sm.example.com"
                }
              }
            }'

      - name: Wait for SM credentials update to finish
        run: ./scripts/testing/wait_for_instance_state.sh aws-cluster

      - name: Assert sap-btp-manager secret updated with credentials from first update
        run: |
          SECRET=$(kubectl get secret sap-btp-manager -n kyma-system -o json)
          CLIENT_ID=$(echo "$SECRET" | jq -r '.data.clientid' | base64 -d)
          CLIENT_SECRET=$(echo "$SECRET" | jq -r '.data.clientsecret' | base64 -d)
          SM_URL=$(echo "$SECRET" | jq -r '.data.sm_url' | base64 -d)
          TOKEN_URL=$(echo "$SECRET" | jq -r '.data.tokenurl' | base64 -d)
          CLUSTER_ID=$(echo "$SECRET" | jq -r '.data.cluster_id' | base64 -d)
          MANAGED_BY=$(echo "$SECRET" | jq -r '.metadata.labels["app.kubernetes.io/managed-by"]')
          echo "clientid: $CLIENT_ID"
          echo "clientsecret: $CLIENT_SECRET"
          echo "sm_url: $SM_URL"
          echo "tokenurl: $TOKEN_URL"
          echo "cluster_id: $CLUSTER_ID"
          echo "managed-by label: $MANAGED_BY"
          [ "$CLIENT_ID" = "test-client-id" ] || { echo "Error: expected clientid=test-client-id, got $CLIENT_ID"; exit 1; }
          [ "$CLIENT_SECRET" = "initial-secret" ] || { echo "Error: expected clientsecret=initial-secret, got $CLIENT_SECRET"; exit 1; }
          [ "$SM_URL" = "https://sm.example.com" ] || { echo "Error: expected sm_url=https://sm.example.com, got $SM_URL"; exit 1; }
          [ "$TOKEN_URL" = "https://token.example.com" ] || { echo "Error: expected tokenurl=https://token.example.com, got $TOKEN_URL"; exit 1; }
          [ -n "$CLUSTER_ID" ] || { echo "Error: cluster_id is empty"; exit 1; }
          [ "$MANAGED_BY" = "kcp-kyma-environment-broker" ] || { echo "Error: expected managed-by=kcp-kyma-environment-broker, got $MANAGED_BY"; exit 1; }
          echo "CLUSTER_ID=$CLUSTER_ID" >> $GITHUB_ENV
          echo "sap-btp-manager secret assertion passed"

      - name: Update instance with rotated clientsecret only (partial credentials)
        run: |
          curl --request PATCH \
            --url "http://localhost:8080/oauth/v2/service_instances/aws-cluster?accepts_incomplete=true" \
            --header "Content-Type: application/json" \
            --header "X-Broker-API-Version: 2.16" \
            --data '{
              "service_id": "47c9dcbf-ff30-448e-ab36-d3bad66ba281",
              "plan_id": "361c511f-f939-4621-b228-d0fb79a1fe15",
              "context": {
                "globalaccount_id": "'"$GLOBAL_ACCOUNT_ID"'",
                "subaccount_id": "8b9a0db4-9aef-4da2-a856-61a4420b66fd",
                "user_id": "user@email.com",
                "sm_operator_credentials": {
                  "clientsecret": "rotated-secret"
                }
              }
            }'

      - name: Wait for partial credentials update to finish
        run: ./scripts/testing/wait_for_instance_state.sh aws-cluster

      - name: Assert sap-btp-manager secret updated with rotated secret, other keys preserved
        run: |
          SECRET=$(kubectl get secret sap-btp-manager -n kyma-system -o json)
          CLIENT_ID=$(echo "$SECRET" | jq -r '.data.clientid' | base64 -d)
          CLIENT_SECRET=$(echo "$SECRET" | jq -r '.data.clientsecret' | base64 -d)
          SM_URL=$(echo "$SECRET" | jq -r '.data.sm_url' | base64 -d)
          TOKEN_URL=$(echo "$SECRET" | jq -r '.data.tokenurl' | base64 -d)
          CLUSTER_ID_AFTER=$(echo "$SECRET" | jq -r '.data.cluster_id' | base64 -d)
          echo "clientid: $CLIENT_ID"
          echo "clientsecret: $CLIENT_SECRET"
          echo "sm_url: $SM_URL"
          echo "tokenurl: $TOKEN_URL"
          echo "cluster_id: $CLUSTER_ID_AFTER"
          [ "$CLIENT_SECRET" = "rotated-secret" ] || { echo "Error: expected clientsecret=rotated-secret, got $CLIENT_SECRET"; exit 1; }
          [ "$CLIENT_ID" = "test-client-id" ] || { echo "Error: clientid should be preserved, got $CLIENT_ID"; exit 1; }
          [ "$SM_URL" = "https://sm.example.com" ] || { echo "Error: sm_url should be preserved, got $SM_URL"; exit 1; }
          [ "$TOKEN_URL" = "https://token.example.com" ] || { echo "Error: tokenurl should be preserved, got $TOKEN_URL"; exit 1; }
          [ "$CLUSTER_ID_AFTER" = "$CLUSTER_ID" ] || { echo "Error: cluster_id should be preserved, got $CLUSTER_ID_AFTER"; exit 1; }
          echo "Partial credentials update assertion passed"

      - name: Add skip-reconciliation label to sap-btp-manager secret (rotation scenario)
        run: |
          kubectl label secret sap-btp-manager -n kyma-system kyma-project.io/skip-reconciliation=true

      - name: Update instance with rotated clientsecret — same clientid/url/sm_url (rotation-only label)
        run: |
          curl --request PATCH \
            --url "http://localhost:8080/oauth/v2/service_instances/aws-cluster?accepts_incomplete=true" \
            --header "Content-Type: application/json" \
            --header "X-Broker-API-Version: 2.16" \
            --data '{
              "service_id": "47c9dcbf-ff30-448e-ab36-d3bad66ba281",
              "plan_id": "361c511f-f939-4621-b228-d0fb79a1fe15",
              "context": {
                "globalaccount_id": "'"$GLOBAL_ACCOUNT_ID"'",
                "subaccount_id": "8b9a0db4-9aef-4da2-a856-61a4420b66fd",
                "user_id": "user@email.com",
                "sm_operator_credentials": {
                  "clientid": "test-client-id",
                  "clientsecret": "rotation-secret",
                  "url": "https://token.example.com",
                  "sm_url": "https://sm.example.com"
                }
              }
            }'

      - name: Wait for rotation-only update to finish
        run: ./scripts/testing/wait_for_instance_state.sh aws-cluster

      - name: Assert skip-reconciliation label removed and new secret written (rotation-only)
        run: |
          SECRET=$(kubectl get secret sap-btp-manager -n kyma-system -o json)
          CLIENT_SECRET=$(echo "$SECRET" | jq -r '.data.clientsecret' | base64 -d)
          SKIP_LABEL=$(echo "$SECRET" | jq -r '.metadata.labels["kyma-project.io/skip-reconciliation"] // empty')
          echo "clientsecret: $CLIENT_SECRET"
          echo "skip-reconciliation label: '$SKIP_LABEL'"
          [ "$CLIENT_SECRET" = "rotation-secret" ] || { echo "Error: expected clientsecret=rotation-secret, got $CLIENT_SECRET"; exit 1; }
          [ -z "$SKIP_LABEL" ] || { echo "Error: skip-reconciliation label should have been removed, got '$SKIP_LABEL'"; exit 1; }
          echo "Rotation-only skip-reconciliation label assertion passed"

      - name: Overwrite secret with different sm_url/tokenurl and re-add skip-reconciliation label (user-managed scenario)
        run: |
          kubectl patch secret sap-btp-manager -n kyma-system \
            --type='json' \
            -p='[
              {"op":"replace","path":"/data/sm_url","value":"'"$(echo -n 'https://user-managed-sm.url' | base64)"'"},
              {"op":"replace","path":"/data/tokenurl","value":"'"$(echo -n 'https://user-managed-token.url' | base64)"'"}
            ]'
          kubectl label secret sap-btp-manager -n kyma-system kyma-project.io/skip-reconciliation=true

      - name: Get ResourceVersion before user-managed skip
        run: |
          RV_BEFORE=$(kubectl get secret sap-btp-manager -n kyma-system -o jsonpath='{.metadata.resourceVersion}')
          echo "ResourceVersion before: $RV_BEFORE"
          echo "RV_BEFORE=$RV_BEFORE" >> $GITHUB_ENV

      - name: Update instance with new credentials — clientid differs from secret (user-managed)
        run: |
          curl --request PATCH \
            --url "http://localhost:8080/oauth/v2/service_instances/aws-cluster?accepts_incomplete=true" \
            --header "Content-Type: application/json" \
            --header "X-Broker-API-Version: 2.16" \
            --data '{
              "service_id": "47c9dcbf-ff30-448e-ab36-d3bad66ba281",
              "plan_id": "361c511f-f939-4621-b228-d0fb79a1fe15",
              "context": {
                "globalaccount_id": "'"$GLOBAL_ACCOUNT_ID"'",
                "subaccount_id": "8b9a0db4-9aef-4da2-a856-61a4420b66fd",
                "user_id": "user@email.com",
                "sm_operator_credentials": {
                  "clientid": "test-client-id",
                  "clientsecret": "should-not-be-written",
                  "url": "https://token.example.com",
                  "sm_url": "https://sm.example.com"
                }
              }
            }'

      - name: Wait for user-managed skip to finish
        run: ./scripts/testing/wait_for_instance_state.sh aws-cluster

      - name: Assert secret not touched when user manages it (sm_url differs)
        run: |
          RV_AFTER=$(kubectl get secret sap-btp-manager -n kyma-system -o jsonpath='{.metadata.resourceVersion}')
          SM_URL=$(kubectl get secret sap-btp-manager -n kyma-system -o jsonpath='{.data.sm_url}' | base64 -d)
          SKIP_LABEL=$(kubectl get secret sap-btp-manager -n kyma-system -o jsonpath='{.metadata.labels.kyma-project\.io/skip-reconciliation}')
          echo "ResourceVersion after: $RV_AFTER"
          echo "sm_url: $SM_URL"
          echo "skip-reconciliation label: $SKIP_LABEL"
          [ "$RV_AFTER" = "$RV_BEFORE" ] || { echo "Error: secret was updated despite user-managed sm_url (RV changed: $RV_BEFORE -> $RV_AFTER)"; exit 1; }
          [ "$SM_URL" = "https://user-managed-sm.url" ] || { echo "Error: user sm_url was overwritten, got $SM_URL"; exit 1; }
          [ "$SKIP_LABEL" = "true" ] || { echo "Error: skip-reconciliation label was removed, should be preserved"; exit 1; }
          echo "User-managed secret assertion passed"

      - name: Restore secret to known state before combined update test
        run: |
          kubectl patch secret sap-btp-manager -n kyma-system \
            --type='json' \
            -p='[
              {"op":"replace","path":"/data/sm_url","value":"'"$(echo -n 'https://sm.example.com' | base64)"'"},
              {"op":"replace","path":"/data/tokenurl","value":"'"$(echo -n 'https://token.example.com' | base64)"'"}
            ]'
          kubectl label secret sap-btp-manager -n kyma-system kyma-project.io/skip-reconciliation-

      - name: Update instance with both new credentials and a parameters change
        run: |
          curl --request PATCH \
            --url "http://localhost:8080/oauth/v2/service_instances/aws-cluster?accepts_incomplete=true" \
            --header "Content-Type: application/json" \
            --header "X-Broker-API-Version: 2.16" \
            --data '{
              "service_id": "47c9dcbf-ff30-448e-ab36-d3bad66ba281",
              "plan_id": "361c511f-f939-4621-b228-d0fb79a1fe15",
              "context": {
                "globalaccount_id": "'"$GLOBAL_ACCOUNT_ID"'",
                "subaccount_id": "8b9a0db4-9aef-4da2-a856-61a4420b66fd",
                "user_id": "user@email.com",
                "sm_operator_credentials": {
                  "clientid": "test-client-id",
                  "clientsecret": "combined-update-secret",
                  "url": "https://token.example.com",
                  "sm_url": "https://sm.example.com"
                }
              },
              "parameters": {
                "machineType": "m5.2xlarge"
              }
            }'

      - name: Wait for combined update to finish
        run: ./scripts/testing/wait_for_instance_state.sh aws-cluster

      - name: Assert credentials updated and cluster_id stable after combined update
        run: |
          SECRET=$(kubectl get secret sap-btp-manager -n kyma-system -o json)
          CLIENT_SECRET=$(echo "$SECRET" | jq -r '.data.clientsecret' | base64 -d)
          CLUSTER_ID_AFTER=$(echo "$SECRET" | jq -r '.data.cluster_id' | base64 -d)
          echo "clientsecret: $CLIENT_SECRET"
          echo "cluster_id: $CLUSTER_ID_AFTER"
          [ "$CLIENT_SECRET" = "combined-update-secret" ] || { echo "Error: expected clientsecret=combined-update-secret, got $CLIENT_SECRET"; exit 1; }
          [ "$CLUSTER_ID_AFTER" = "$CLUSTER_ID" ] || { echo "Error: cluster_id should be stable across updates, got $CLUSTER_ID_AFTER"; exit 1; }
          echo "Combined context+parameters update assertion passed"
